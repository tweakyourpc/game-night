<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3a2416">
<title>Game Night</title>
<style>/* Game Night shell styles. Every color, font, texture and border comes from the active
   theme through --gn-* custom properties (see src/themes/<id>/theme.json). */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  background: var(--gn-tex-table, #3a2416); background-color: var(--gn-table, #3a2416);
  color: var(--gn-table-text, #f6ead7); font-family: var(--gn-font-body, Georgia, serif); font-size: 16px; line-height: 1.45;
}
button, input, select, textarea { font: inherit; font-family: var(--gn-font-ui, system-ui, sans-serif); }
h1, h2, h3 { font-family: var(--gn-font-display, Georgia, serif); font-weight: 600; line-height: 1.2; margin: 0 0 .5em; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1.05rem; }
:focus-visible { outline: 3px solid var(--gn-focus, #ffc94d); outline-offset: 2px; }
.gn-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* layout */
.gn-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; flex-wrap: wrap;
  border-bottom: 1px solid rgba(255,255,255,.12); }
.gn-top-left, .gn-top-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
.gn-title { font-size: 1.35rem; margin: 0; overflow-wrap: anywhere; }
.gn-sub { color: var(--gn-table-muted); font-size: .9rem; }
.gn-table-title { display: flex; flex-direction: column; min-width: 0; }
.gn-center { min-height: 80vh; display: grid; place-items: center; padding: 16px; }
.gn-lobby { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
.gn-wide { grid-column: 1 / -1; }
.gn-table { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; align-items: start; }
.gn-table-main { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.gn-table-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (max-width: 860px) {
  .gn-lobby { grid-template-columns: minmax(0, 1fr); }
  .gn-table { grid-template-columns: minmax(0, 1fr); padding: 10px; }
  .gn-lobby { padding: 10px; }
}

/* surfaces */
.gn-panel, .gn-card, .gn-modal {
  background: var(--gn-tex-surface); background-color: var(--gn-surface); color: var(--gn-surface-text);
  border-radius: var(--gn-radius); box-shadow: var(--gn-shadow); padding: 14px 16px; min-width: 0;
}
.gn-card { width: min(440px, 100%); }
.gn-entry h1 { font-size: 1.7rem; }
.gn-help { color: var(--gn-muted); font-size: .9rem; margin: .35em 0; }
.gn-table-side .gn-help, .gn-panel .gn-help { color: var(--gn-muted); }
.gn-note { background: var(--gn-surface-alt); padding: 8px 10px; border-radius: var(--gn-radius-sm); }
.gn-tag { display: inline-block; font-size: .72rem; padding: 1px 6px; margin-left: 6px; border-radius: 999px;
  background: var(--gn-surface-alt); color: var(--gn-muted); vertical-align: middle; font-family: var(--gn-font-ui); }

/* controls */
.gn-btn { appearance: none; border: 0; cursor: pointer; min-height: 44px; padding: 8px 16px; border-radius: var(--gn-btn-radius);
  background: var(--gn-btn-face); background-color: var(--gn-accent); color: var(--gn-accent-text); box-shadow: var(--gn-btn-shadow); font-weight: 600; }
.gn-btn:hover:not(:disabled) { filter: brightness(1.07); }
.gn-btn:active:not(:disabled) { transform: translateY(1px); }
.gn-btn:disabled { opacity: .55; cursor: not-allowed; }
.gn-btn[aria-busy="true"] { cursor: progress; }
.gn-quiet { background: var(--gn-btn-quiet); background-color: var(--gn-surface); color: var(--gn-surface-text); border: 1px solid var(--gn-line); }
.gn-go { background-color: var(--gn-good); background-image: none; color: #fff; }
.gn-danger { color: var(--gn-bad); }
.gn-link { background: none; border: 0; color: inherit; text-decoration: underline; cursor: pointer; padding: 6px 4px; min-height: 36px; }
.gn-icon-btn { background: none; border: 1px solid rgba(255,255,255,.25); color: inherit; border-radius: 999px; min-width: 40px; min-height: 40px; cursor: pointer; }
.gn-sound { display: flex; align-items: center; gap: 6px; }
.gn-sound input[type=range] { width: 90px; accent-color: var(--gn-accent); }
input[type=text], input[type=email], input[type=url], input[type=password], select, textarea {
  width: 100%; min-height: 44px; padding: 8px 10px; border-radius: var(--gn-radius-sm); border: 1px solid var(--gn-line);
  background: #fff; color: #1a1a1a; }
label { display: block; font-weight: 600; margin: .6em 0 .25em; font-family: var(--gn-font-ui); font-size: .95rem; }
.gn-check { display: flex; gap: 8px; align-items: center; font-weight: 400; }
.gn-check input { width: 20px; height: 20px; accent-color: var(--gn-accent); }
.gn-row { display: flex; gap: 8px; align-items: center; }
.gn-row > input, .gn-row > select { flex: 1; min-width: 0; }
.gn-wrap { flex-wrap: wrap; }
.gn-end { justify-content: flex-end; margin-top: 12px; }
.gn-form { display: flex; flex-direction: column; }
.gn-fieldset { border: 1px solid var(--gn-line); border-radius: var(--gn-radius-sm); margin: 8px 0; }
.gn-more { margin-top: 10px; }
.gn-more summary { cursor: pointer; font-weight: 600; padding: 6px 0; font-family: var(--gn-font-ui); }
.gn-linkbox { font-size: .85rem; }

/* lists */
.gn-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.gn-list > li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.gn-plain { margin: .3em 0 .6em; padding-left: 1.2em; }
.gn-row-btn { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 12px; min-height: 48px;
  background: var(--gn-surface-alt); color: var(--gn-surface-text); border: 1px solid var(--gn-line); border-radius: var(--gn-radius-sm); cursor: pointer; }
.gn-row-btn:hover { filter: brightness(1.03); }
.gn-row-btn > span { grid-column: 1; font-size: .92rem; }
.gn-row-btn .gn-when { grid-column: 2; grid-row: 1; }
.gn-when { color: var(--gn-muted); font-size: .82rem; white-space: nowrap; }
.gn-chips { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.gn-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--gn-surface-alt); }
.gn-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 2px solid var(--gn-muted); flex: none; }
.gn-dot.gn-on { background: var(--gn-good); border-color: var(--gn-good); }
.gn-names { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 12px; }
.gn-name { min-height: 48px; border-radius: var(--gn-radius-sm); border: 1px solid var(--gn-line); background: var(--gn-surface-alt); color: var(--gn-surface-text); cursor: pointer; font-weight: 600; }
.gn-name:hover { background: #fff; }
.gn-new summary { cursor: pointer; font-weight: 600; margin: 8px 0; }
.gn-member { display: flex !important; flex-wrap: wrap; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--gn-line); }
.gn-admin-row { margin-bottom: 10px; }
.gn-member > .gn-row { flex-basis: 100%; }
.gn-admin { max-width: 640px; }

/* catalog */
.gn-catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.gn-game-card { background: var(--gn-surface-alt); border-radius: var(--gn-radius); padding: 12px; display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--gn-line); }
.gn-game-card p { margin: 0 0 4px; font-size: .93rem; }
.gn-game-card .gn-row { margin-top: auto; flex-wrap: wrap; }
.gn-preview { height: 120px; border-radius: var(--gn-radius-sm); background: var(--gn-tex-table); background-color: var(--gn-table); display: grid; place-items: center; overflow: hidden; margin-bottom: 6px; }
.gn-preview svg { width: 100%; height: 100%; }

/* table */
.gn-seats { list-style: none; padding: 0; margin: 0 0 8px; display: flex; flex-direction: column; gap: 6px; }
.gn-seat { display: grid; grid-template-columns: 32px 1fr auto auto; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--gn-radius-sm); background: var(--gn-surface-alt); }
.gn-seat-chip { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; box-shadow: inset 0 0 0 2px rgba(0,0,0,.2); }
.gn-seat-name { font-weight: 600; overflow-wrap: anywhere; }
.gn-ready-mark { font-size: .82rem; color: var(--gn-muted); }
.gn-ready .gn-ready-mark { color: var(--gn-good); font-weight: 700; }
.gn-banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-radius: var(--gn-radius);
  background: rgba(0,0,0,.25); color: var(--gn-table-text); font-family: var(--gn-font-ui); }
.gn-banner-go { background: var(--gn-accent); color: var(--gn-accent-text); }
.gn-banner-done { background: var(--gn-surface); color: var(--gn-surface-text); }
.gn-banner .gn-help { color: inherit; opacity: .85; width: 100%; }
.gn-play { min-height: 120px; }
.gn-waiting { max-width: 560px; }
.gn-preview-big { height: 220px; }
.gn-board-host { width: 100%; }

/* dialogs and messages */
.gn-modal-wrap { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: grid; place-items: center; padding: 16px; z-index: 50; }
.gn-modal { width: min(460px, 100%); max-height: calc(100vh - 32px); overflow: auto; }
.gn-modal-wide { width: min(640px, 100%); }
.gn-howto h3 { margin-top: 1em; }
.gn-howto ul, .gn-howto ol { padding-left: 1.3em; }
#gn-toasts { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; width: min(480px, calc(100% - 32px)); pointer-events: none; }
.gn-toast { padding: 10px 14px; border-radius: var(--gn-radius-sm); background: #222; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.4); transition: opacity .4s, transform .4s; font-family: var(--gn-font-ui); }
.gn-toast-good { background: var(--gn-good); }
.gn-toast-bad { background: var(--gn-bad); }
.gn-toast-out { opacity: 0; transform: translateY(8px); }
.gn-debug { position: fixed; right: 8px; bottom: 8px; background: rgba(0,0,0,.8); color: #9f9; font: 11px/1.3 monospace; padding: 6px 8px; z-index: 70; border-radius: 4px; pointer-events: none; }

/* shared game pieces: games may use these */
.gn-board-frame { background: var(--gn-tex-board); background-color: var(--gn-board-base); box-shadow: var(--gn-frame); border-radius: var(--gn-radius); }
.gn-piece { background-image: var(--gn-tex-piece); }
.gn-scorebar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
.gn-score { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: var(--gn-surface); color: var(--gn-surface-text); font-family: var(--gn-font-ui); }
.gn-score.gn-turn { box-shadow: 0 0 0 3px var(--gn-highlight); }
.gn-score b { font-family: var(--gn-font-numbers); }

/* replay player */
.gn-replay { position: fixed; inset: 0; z-index: 55; overflow: auto; padding: 14px 16px 24px; background: var(--gn-tex-table); background-color: var(--gn-table); color: var(--gn-table-text); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.gn-replay > * { width: min(100%, 900px); }
.gn-replay .gn-help { color: var(--gn-table-muted); }
.gn-replay-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.gn-replay-head h2 { margin: 0; font-size: 1.2rem; }
.gn-replay-stage { display: flex; justify-content: center; }
.gn-replay-stage .gn-board-host { width: min(100%, 680px); }
.gn-replay-caption { min-height: 2.6em; text-align: center; font-size: 1.05rem; margin: 4px 0; }
.gn-replay-controls { justify-content: center; }
.gn-replay input[type=range] { width: min(100%, 900px); accent-color: var(--gn-accent); }
.gn-replay-controls > select { flex: none; width: auto; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}
</style>

<script>/*
 * Game Night browser core: server calls, polling, themes, sound, small DOM helpers.
 * Plain browser JavaScript with no build step or framework. The same file runs inside
 * the Apps Script page and under tools/dev_server.js.
 */
var GNC = window.GNC || {};
window.GNC = GNC;

GNC.boot = window.GN_BOOT || { ready: false };
GNC.games = GNC.games || {};          // game id -> browser module (src/games/<id>/ui.js)

// ------------------------------------------------------------------ helpers

GNC.el = function (tag, attrs) {
  var e = document.createElement(tag);
  var kids = Array.prototype.slice.call(arguments, 2);
  if (attrs) {
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else e.setAttribute(k, v);
    });
  }
  kids.forEach(function add(c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) return c.forEach(add);
    e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  });
  return e;
};

GNC.esc = function (s) {
  return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
};

GNC.clear = function (node) { while (node.firstChild) node.removeChild(node.firstChild); return node; };

GNC.newActionId = function () {
  var a = new Uint8Array(12);
  (window.crypto || window.msCrypto).getRandomValues(a);
  return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
};

GNC.store = {
  get: function (k) { try { return window.localStorage.getItem('gn.' + k); } catch (e) { return null; } },
  set: function (k, v) { try { window.localStorage.setItem('gn.' + k, v); } catch (e) { /* private mode */ } },
  del: function (k) { try { window.localStorage.removeItem('gn.' + k); } catch (e) { /* ignore */ } },
};

GNC.when = function (ms) {
  if (!ms) return '';
  var d = new Date(ms), now = new Date();
  var time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return 'today ' + time;
  var y = new Date(now.getTime() - 86400000);
  if (d.toDateString() === y.toDateString()) return 'yesterday ' + time;
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + time;
};

/** Spoken updates for screen readers (polite) without moving focus. */
GNC.announce = function (text) {
  var live = document.getElementById('gn-live');
  if (!live) return;
  live.textContent = '';
  setTimeout(function () { live.textContent = text; }, 30);
};

/** A brief message at the bottom of the screen. kind: info | good | bad */
GNC.toast = function (text, kind) {
  var box = document.getElementById('gn-toasts');
  if (!box || !text) return;
  var t = GNC.el('div', { class: 'gn-toast gn-toast-' + (kind || 'info'), role: kind === 'bad' ? 'alert' : 'status' }, text);
  box.appendChild(t);
  setTimeout(function () { t.classList.add('gn-toast-out'); }, 3800);
  setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 4300);
};

/**
 * An in-page dialog (never window.confirm, which blocks the page and some browsers
 * suppress inside the Apps Script frame). Resolves true/false.
 */
GNC.confirm = function (title, body, okLabel, cancelLabel) {
  return new Promise(function (resolve) {
    var prev = document.activeElement;
    var done = function (v) {
      document.removeEventListener('keydown', onKey, true);
      if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
      if (prev && prev.focus) prev.focus();
      resolve(v);
    };
    var onKey = function (e) { if (e.key === 'Escape') { e.preventDefault(); done(false); } };
    var ok = GNC.el('button', { class: 'gn-btn', onclick: function () { done(true); } }, okLabel || 'OK');
    var wrap = GNC.el('div', { class: 'gn-modal-wrap' },
      GNC.el('div', { class: 'gn-modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'gn-modal-title' },
        GNC.el('h2', { id: 'gn-modal-title' }, title),

    var slider = el('input', { type: 'range', min: '0', max: String(fr.length - 1), value: '0', 'aria-label': 'Position in the replay' });
    var counter = el('span', { class: 'gn-help' });
    var playBtn = el('button', { class: 'gn-btn', onclick: function () { timer ? pause() : play(); } }, 'Play');
    var status = el('p', { class: 'gn-help', role: 'status' });
    var speedSel = el('select', { 'aria-label': 'Speed', onchange: function () { speed = Number(speedSel.value); if (timer) { pause(); play(); } } },
      [['0.5', 'Slow'], ['1', 'Normal'], ['2', 'Fast'], ['4', 'Very fast']].map(function (o) { return el('option', { value: o[0], selected: o[0] === '1' }, o[1]); }));
    var exportRow = el('div', { class: 'gn-row gn-wrap' });
    var title = rp.game.name + (rp.match.tableTitle ? ' at ' + rp.match.tableTitle : '') + ', ' + GNC.when(rp.match.started);
    var wrap = el('div', { class: 'gn-replay', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Replay: ' + title },
      el('div', { class: 'gn-replay-head' }, el('h2', null, 'Replay: ' + title),
        el('button', { class: 'gn-btn gn-quiet', onclick: close }, 'Close')),
      el('p', { class: 'gn-help' }, rp.players.map(function (p) { return p.name; }).join(', ') + ' · rules version ' + rp.game.rulesVersion),
      stage, caption,
      el('div', { class: 'gn-row gn-wrap gn-replay-controls' },
        el('button', { class: 'gn-btn gn-quiet', 'aria-label': 'First move', onclick: function () { pause(); go(0); } }, '⏮'),
        el('button', { class: 'gn-btn gn-quiet', 'aria-label': 'Previous move', onclick: function () { pause(); go(i - 1); } }, '◀'),
        playBtn,
        el('button', { class: 'gn-btn gn-quiet', 'aria-label': 'Next move', onclick: function () { pause(); go(i + 1); } }, '▶'),
        el('button', { class: 'gn-btn gn-quiet', 'aria-label': 'Last move', onclick: function () { pause(); go(fr.length - 1); } }, '⏭'),
        speedSel, counter),
      slider, exportRow, status);
    slider.addEventListener('input', function () { pause(); go(Number(slider.value)); });
    var onKey = function (e) { if (e.key === 'Escape' && !recording) close(); };
    document.addEventListener('keydown', onKey);
    document.body.appendChild(wrap);
    var host = el('div', { class: 'gn-board-host' });
    stage.appendChild(host);
    inst = mod.mount(host, api);

    function matchAt(k) {
      var last = k === fr.length - 1 && rp.final;
      return { id: 'replay-' + rp.match.id, table_id: rp.match.table, game_id: rp.game.id, players: rp.players, actors: [],
        status: last ? rp.final.status : 'active', result: last ? rp.final : null, rev: fr[k].rev, view: fr[k].snapshot,
        options: rp.options, theme_id: rp.theme.id, spectator: true, me: null };
    }
    function go(k) {
      k = Math.max(0, Math.min(fr.length - 1, k));
      var m = matchAt(k);
      inst.update(m, { reason: 'replay', previous: prevMatch });
      prevMatch = m;
      i = k;
      slider.value = String(k);
      counter.textContent = (k + 1) + ' / ' + fr.length;
      caption.textContent = fr[k].caption;
    }
    function play() {
      if (i >= fr.length - 1) go(0);
      playBtn.textContent = 'Pause';
      timer = setInterval(function () { if (i >= fr.length - 1) return pause(); go(i + 1); }, 1500 / speed);
    }
    function pause() { clearInterval(timer); timer = null; playBtn.textContent = 'Play'; }
    function close() {
      closed = true;
      if (cancelRecording) cancelRecording('Recording cancelled.');
      pause();
      document.removeEventListener('keydown', onKey);
      if (inst && inst.destroy) inst.destroy();
      wrap.remove();
      if (prevTheme) GNC.applyTheme(prevTheme);
    }
    var fileBase = (rp.game.name + ' ' + new Date(rp.match.started).toISOString().slice(0, 10)).replace(/[^A-Za-z0-9 _-]/g, '');

    // exports, by what this browser and this person can do
    exportRow.appendChild(el('button', { class: 'gn-btn gn-quiet', onclick: function () {
      download(new Blob([JSON.stringify(rp, null, 1)], { type: 'application/json' }), fileBase + '.json');
    } }, 'Download replay file'));
    var isAdmin = GNC.app && GNC.app.lobby && GNC.app.lobby.me.role === 'admin';
    if (isAdmin) {
      exportRow.appendChild(el('button', { class: 'gn-btn gn-quiet', onclick: function (e) {
        var b = e.currentTarget; b.disabled = true;
        GNC.call('saveReplay', GNC.session.token(), rp.match.id).then(function (r) {
          b.disabled = false;
          status.textContent = r.ok ? 'Saved to the group\'s Drive folder as ' + r.name + '.' : r.error;
        });
      } }, 'Save replay file to Drive'));
    }
    var mime = videoType();
    if (mime) {
      canDraw(host).then(function (yes) {
        if (closed) return;
        if (!yes) { status.textContent = 'Video recording is not available in this browser; the replay file still works.'; return; }
        exportRow.appendChild(el('button', { class: 'gn-btn', onclick: function (e) { record(e.currentTarget); } }, 'Record video'));
      });
    } else {
      status.textContent = 'This browser cannot record video; download the replay file instead.';
    }

    function record(btn) {
      pause();
      recording = true;
      btn.disabled = true;
      var W = 1280, H = 720;
      var canvas = el('canvas', { width: String(W), height: String(H) });
      var ctx = canvas.getContext('2d');
      var stream = null, rec = null, failed = false;
      function release() {
        if (stream) stream.getTracks().forEach(function (track) { track.stop(); });
        document.removeEventListener('visibilitychange', visibility);
        recording = false; btn.disabled = false; cancelRecording = null;
      }
      function fail(message) {
        failed = true;
        try { if (rec && rec.state !== 'inactive') rec.stop(); } catch (e) { /* release below */ }
        release();
        status.textContent = message + ' The replay file still works.';
      }
      function visibility() { if (document.hidden) fail('Recording stopped because the tab was hidden.'); }
      cancelRecording = fail;
      try {
        if (document.hidden || !ctx) throw new Error('Keep this tab visible while recording.');
        stream = canvas.captureStream(15);
        if (!stream.getVideoTracks().length) throw new Error('Canvas capture is unavailable.');
        rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 3000000 });
      } catch (e) { fail('Recording unavailable: ' + e.message); return; }
      rec.onerror = function () { fail('The browser video encoder failed.'); };
      document.addEventListener('visibilitychange', visibility);
      var chunks = [];
      rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
      var bg = getComputedStyle(document.documentElement).getPropertyValue('--gn-table').trim() || '#222';
      var ink = getComputedStyle(document.documentElement).getPropertyValue('--gn-table-text').trim() || '#fff';
      function paint(img, text) {
        ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
        var s = Math.min((W - 80) / img.width, (H - 150) / img.height);
        ctx.drawImage(img, (W - img.width * s) / 2, 70, img.width * s, img.height * s);
        ctx.fillStyle = ink; ctx.textAlign = 'center';
        ctx.font = '600 30px ' + getComputedStyle(document.body).fontFamily;
        ctx.fillText(title, W / 2, 46);
        ctx.font = '24px ' + getComputedStyle(document.body).fontFamily;
        ctx.fillText(text.length > 110 ? text.slice(0, 107) + '…' : text, W / 2, H - 30);
      }
      var k = 0, hold = Math.max(600, 1500 / speed);
      try { rec.start(1000); } catch (e) { fail('Recording unavailable: ' + e.message); return; }
      status.textContent = 'Recording… keep this tab open and visible.';
      function step() {
        if (failed || closed) return Promise.resolve();
        if (k >= fr.length) {
          return GNC.later(2500).then(function () { if (!failed && rec.state !== 'inactive') rec.stop(); });
        }
        go(k);
        status.textContent = 'Recording move ' + (k + 1) + ' of ' + fr.length + '… keep this tab open.';
        return GNC.later(80).then(function () { return rasterize(host); }).then(function (img) {
          if (failed || closed) return;
          paint(img, fr[k].caption);
          k++;
          return GNC.later(hold).then(step);
        });
      }
      rec.onstop = function () {
        release();
        if (failed || closed) return;
        var type = mime.split(';')[0];
        var blob = new Blob(chunks, { type: type });
        if (!blob.size) { fail('The encoder produced no video.'); return; }
        var name = fileBase + (type === 'video/mp4' ? '.mp4' : '.webm');
        status.textContent = 'Video ready (' + Math.round(blob.size / 1024) + ' KB, ' + type + ').';
        exportRow.appendChild(el('button', { class: 'gn-btn', onclick: function () { download(blob, name); } }, 'Download video'));
        if (isAdmin) {
          exportRow.appendChild(el('button', { class: 'gn-btn gn-quiet', onclick: function (e) {
            var b = e.currentTarget; b.disabled = true;
            saveVideoToDrive(blob, name, type, function (t) { status.textContent = t; }, function () { return closed; }).then(function (r) {
              b.disabled = false;
              status.textContent = r.ok ? 'Saved to the group\'s Drive folder as ' + r.name + '.' : r.error;
            });
          } }, 'Save video to Drive'));
        }
      };
      step().catch(function (err) {
        fail('Recording stopped: ' + (err && err.message || err));
      });
    }

    go(0);
    playBtn.focus();
  }

  return { open: open, frames: frames, describe: describe };
})();
</script>
<script>// ---- src/games/checkers/ui.js
/*
 * Checkers in the browser. Each player sees their own pieces at the bottom. Tap (or
 * click, or Tab + Enter) one of your pieces that can move, then a highlighted square.
 * When a capture is compulsory only the capturing pieces are offered; during a
 * multi-jump the continuing piece stays selected. Squares are named a1-h8 from Dark's
 * side.
 */
(function () {
  var N = 8;
  var CSS = [
    '.ck { display: grid; gap: 10px; justify-items: center; }',
    '.ck-frame { width: min(100%, 560px); padding: 12px; border-radius: var(--gn-radius); background: var(--gn-tex-board); background-color: var(--gn-board-base); box-shadow: var(--gn-frame); }',
    '.ck-board { position: relative; display: grid; grid-template-columns: repeat(8, 1fr); aspect-ratio: 1 / 1; border: 2px solid var(--gn-board-line); }',
    '.ck-sq { position: relative; display: grid; place-items: center; border: 0; padding: 0; margin: 0; background: var(--gn-board-cell); }',
    '.ck-sq.ck-dark { background: var(--gn-board-dark); }',
    'button.ck-sq { cursor: pointer; }',
    '.ck-sq:focus-visible { outline: 3px solid var(--gn-focus); outline-offset: -3px; z-index: 3; }',
    '.ck-sq.ck-from::after, .ck-sq.ck-to-last::after { content: ""; position: absolute; inset: 0; background: var(--gn-highlight); opacity: .22; pointer-events: none; }',
    '.ck-target::before { content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: var(--gn-highlight); opacity: .9; box-shadow: 0 0 0 3px rgba(0,0,0,.25); }',
    '.ck-target.ck-cap::before { width: 46%; height: 46%; background: transparent; border: 4px solid var(--gn-highlight); opacity: 1; }',
    '.ck-piece { position: relative; width: 78%; height: 78%; border-radius: 50%; display: grid; place-items: center; font-size: clamp(12px, 3.4vw, 24px); line-height: 1;',
    '  background-image: var(--gn-tex-piece); box-shadow: inset 0 0 0 3px rgba(0,0,0,.18), inset 0 -4px 0 rgba(0,0,0,.25), 0 3px 4px rgba(0,0,0,.45); z-index: 1; }',
    '.ck-p0 { background-color: #2a2422; color: #f3d77a; }',
    '.ck-p1 { background-color: #efe3c8; color: #8a5a00; }',
    '[data-theme="slate"] .ck-p0 { background-color: #1d2a36; color: #ffd36e; } [data-theme="slate"] .ck-p1 { background-color: #f5f7f9; color: #9a6400; }',
    '.ck-king { box-shadow: inset 0 0 0 3px rgba(0,0,0,.18), inset 0 -4px 0 rgba(0,0,0,.25), 0 3px 0 -1px rgba(0,0,0,.45), 0 6px 4px rgba(0,0,0,.4); }',
    '.ck-movable { box-shadow: 0 0 0 3px var(--gn-highlight), 0 3px 4px rgba(0,0,0,.45); }',
    '.ck-must { box-shadow: 0 0 0 4px var(--gn-highlight), 0 0 14px 4px var(--gn-highlight); }',
    '.ck-selected { transform: translateY(-6%) scale(1.06); box-shadow: 0 0 0 4px var(--gn-focus), 0 8px 10px rgba(0,0,0,.45); }',
    '.ck-cont { animation: ck-pulse 1s ease-in-out infinite alternate; }',
    '@keyframes ck-pulse { from { box-shadow: 0 0 0 3px var(--gn-highlight); } to { box-shadow: 0 0 0 7px var(--gn-highlight), 0 0 18px 6px var(--gn-highlight); } }',
    '.ck-slide { animation: ck-slide .35s cubic-bezier(.3,.8,.4,1) both; }',
    '@keyframes ck-slide { from { transform: translate(var(--ck-dx), var(--ck-dy)); } to { transform: none; } }',
    '.ck-gone { position: absolute; width: 78%; height: 78%; border-radius: 50%; animation: ck-gone .5s ease-in forwards; pointer-events: none; }',
    '@keyframes ck-gone { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(.3) rotate(25deg); } }',
    '.ck-crownpop { animation: ck-pop .5s .3s cubic-bezier(.2,1.6,.4,1) both; display: inline-block; }',
    '@keyframes ck-pop { from { transform: scale(0); } to { transform: none; } }',
    '.ck-coord { position: absolute; font: 600 9px/1 var(--gn-font-ui); opacity: .6; pointer-events: none; }',
    '.ck-coord.f { right: 3px; bottom: 2px; } .ck-coord.r { left: 3px; top: 2px; }',
    '.ck-help { text-align: center; font-family: var(--gn-font-ui); min-height: 1.4em; margin: 0; }',
    '.ck-offer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 8px 12px; border-radius: var(--gn-radius); background: var(--gn-surface); color: var(--gn-surface-text); }',
    '.ck-controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }',
  ].join('\n');

  function injectCss() {
    if (document.getElementById('ck-css')) return;
    var st = document.createElement('style'); st.id = 'ck-css'; st.textContent = CSS; document.head.appendChild(st);
  }

  function preview(el) {
    var html = '<svg viewBox="0 0 210 130"><rect x="45" y="5" width="120" height="120" fill="var(--gn-board-cell)"/>';
    for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) {
      if ((r + c) % 2) {
        html += '<rect x="' + (45 + c * 15) + '" y="' + (5 + r * 15) + '" width="15" height="15" fill="var(--gn-board-dark)"/>';
        if (r < 3 || r > 4) html += '<circle cx="' + (52.5 + c * 15) + '" cy="' + (12.5 + r * 15) + '" r="5.6" fill="' + (r < 3 ? '#efe3c8' : '#2a2422') + '" stroke="rgba(0,0,0,.35)"/>';
      }
    }
    el.innerHTML = html + '</svg>';
  }

  function mount(host, api) {
    injectCss();
    var el = api.el;
    var m = null, v = null, sel = null, sending = false, lastRev = -1;
    var root = el('div', { class: 'ck' });
    var bar = el('div', { class: 'gn-scorebar', role: 'list', 'aria-label': 'Players' });
    var offer = el('div', { 'aria-live': 'polite' });
    var frame = el('div', { class: 'ck-frame' });
    var board = el('div', { class: 'ck-board', role: 'group' });
    var help = el('p', { class: 'ck-help', 'aria-live': 'polite' });
    var controls = el('div', { class: 'ck-controls' });
    frame.appendChild(board);
    root.appendChild(bar); root.appendChild(offer); root.appendChild(frame); root.appendChild(help); root.appendChild(controls);
    host.appendChild(root);

    function mySeat() { return v.players.indexOf(api.me); }
    function flipped() { return mySeat() === 1; }
    function myTurn() { return m && m.status === 'active' && m.actors.indexOf(api.me) >= 0 && !sending; }
    function seatName(o) { return o === 0 ? 'Dark' : 'Light'; }
    function person(id) { return api.player(id) || { name: '?', color: '#888', text: '#fff', symbol: '?' }; }
    function sqName(r, c) { return 'abcdefgh'[c] + (N - r); }
    function same(a, b) { return a && b && a[0] === b[0] && a[1] === b[1]; }
    function movesFrom(r, c) { return (myTurn() ? v.legal : []).filter(function (x) { return x.from[0] === r && x.from[1] === c; }); }

    function act(action) {
      sending = true; render();
      return api.act(action).then(function (r) { sending = false; render(); return r; });
    }

    function onSquare(r, c) {
      if (!myTurn()) return;
      var target = sel && movesFrom(sel[0], sel[1]).filter(function (x) { return x.to[0] === r && x.to[1] === c; })[0];
      if (target) {
        help.textContent = 'Moving…';
        act({ type: 'move', from: target.from, to: target.to }).then(function (res) {
          if (res.ok) {
            api.sound(target.capture ? 'capture' : 'place');
            sel = res.match && res.match.view.continuing ? res.match.view.continuing : null;
            render();
          }
        });
        return;
      }
      if (movesFrom(r, c).length && !v.continuing) { sel = same(sel, [r, c]) ? null : [r, c]; api.sound('click'); render(); }
    }

    function pieceEl(p, extra) {
      return el('span', { class: 'ck-piece ck-p' + p.o + (p.k ? ' ck-king' : '') + (extra ? ' ' + extra : ''), 'aria-hidden': 'true' }, p.k ? '♛' : '');
    }

    function render(animate) {
      var me = mySeat();
      GNC.clear(bar);
      [0, 1].forEach(function (o) {
        var id = v.players[o], p = person(id), turn = m.status === 'active' && v.turn === o;
        bar.appendChild(el('span', { class: 'gn-score' + (turn ? ' gn-turn' : ''), role: 'listitem',
          'aria-label': p.name + ' plays ' + seatName(o) + ', ' + v.pieces[o] + ' pieces' + (turn ? ', to move' : '') },
        el('span', { class: 'ck-piece ck-p' + o, style: { width: '24px', height: '24px' }, 'aria-hidden': 'true' }),
        p.name + ' (' + seatName(o) + ')', el('b', null, String(v.pieces[o]))));
      });

      GNC.clear(offer);
      if (m.status === 'active' && v.drawOffer && me >= 0) {
        if (v.drawOffer === api.me) {
          offer.appendChild(el('div', { class: 'ck-offer' }, 'You offered a draw.',
            el('button', { class: 'gn-btn gn-quiet', onclick: function () { act({ type: 'withdraw-draw' }); } }, 'Withdraw offer')));
        } else {
          offer.appendChild(el('div', { class: 'ck-offer', role: 'alert' }, person(v.drawOffer).name + ' offers a draw.',
            el('button', { class: 'gn-btn', onclick: function () { act({ type: 'accept-draw' }).then(function (r) { if (r.ok) api.sound('score'); }); } }, 'Accept draw'),
            el('button', { class: 'gn-btn gn-quiet', onclick: function () { act({ type: 'decline-draw' }); } }, 'Decline')));
        }
      }

      if (v.continuing && myTurn()) sel = v.continuing;
      var targets = sel ? movesFrom(sel[0], sel[1]) : [];
      var movable = {};
      (myTurn() ? v.legal : []).forEach(function (x) { movable[x.from.join()] = true; });
      var last = animate ? v.last : null;
      var lastShown = v.last;
      var focused = board.contains(document.activeElement) ? document.activeElement.getAttribute('data-sq') : null;
      GNC.clear(board);
      board.setAttribute('aria-label', 'Board' + (flipped() ? ', seen from Light\'s side' : '') + '. ' + (v.mustCapture && myTurn() ? 'A capture is compulsory.' : ''));
      for (var vr = 0; vr < N; vr++) {
        for (var vc = 0; vc < N; vc++) {
          var r = flipped() ? N - 1 - vr : vr, c = flipped() ? N - 1 - vc : vc;
          var dark = (r + c) % 2 === 1;
          var p = v.rows[r][c];
          var tgt = targets.filter(function (x) { return x.to[0] === r && x.to[1] === c; })[0];
          var actionable = dark && myTurn() && (movable[r + ',' + c] || tgt);
          var cls = 'ck-sq' + (dark ? ' ck-dark' : '') + (tgt ? ' ck-target' + (tgt.capture ? ' ck-cap' : '') : '') +
            (lastShown && same(lastShown.from, [r, c]) ? ' ck-from' : '') + (lastShown && same(lastShown.to, [r, c]) ? ' ck-to-last' : '');
          var label = sqName(r, c) + (p ? ', ' + seatName(p.o) + (p.k ? ' king' : ' man') : dark ? ', empty' : '');
          if (movable[r + ',' + c]) label += v.mustCapture ? ', must capture' : ', can move';
          if (tgt) label += tgt.capture ? ', jump here to capture ' + sqName(tgt.capture[0], tgt.capture[1]) : ', move here';
          var sq = actionable ? el('button', { class: cls, 'data-sq': r + '-' + c, 'aria-label': label, 'aria-pressed': same(sel, [r, c]) ? 'true' : null })
            : el('span', { class: cls, role: dark ? 'img' : null, 'aria-label': dark ? label : null });
          if (vr === N - 1) sq.appendChild(el('span', { class: 'ck-coord f', 'aria-hidden': 'true' }, 'abcdefgh'[c]));
          if (vc === 0) sq.appendChild(el('span', { class: 'ck-coord r', 'aria-hidden': 'true' }, String(N - r)));
          if (p) {
            var extra = (same(sel, [r, c]) ? 'ck-selected' : '') + (movable[r + ',' + c] ? (v.mustCapture ? ' ck-must' : ' ck-movable') : '') +
              (v.continuing && same(v.continuing, [r, c]) ? ' ck-cont' : '');
            var pe = pieceEl(p, extra);
            if (last && same(last.to, [r, c])) {
              var dy = (last.from[0] - last.to[0]) * (flipped() ? -100 : 100), dx = (last.from[1] - last.to[1]) * (flipped() ? -100 : 100);
              pe.classList.add('ck-slide');
              pe.style.setProperty('--ck-dx', (dx / 0.78) + '%'); pe.style.setProperty('--ck-dy', (dy / 0.78) + '%');
              if (last.crowned) { pe.textContent = ''; pe.appendChild(el('span', { class: 'ck-crownpop' }, '♛')); }
            }
            sq.appendChild(pe);
          }
          if (last && last.captured && same(last.captured.at, [r, c])) {
            sq.appendChild(el('span', { class: 'ck-gone ck-piece ck-p' + (1 - v.players.indexOf(last.player)), 'aria-hidden': 'true' }));
          }
          if (actionable) (function (rr, cc) { sq.addEventListener('click', function () { onSquare(rr, cc); }); })(r, c);
          board.appendChild(sq);
        }
      }
      if (focused) { var f = board.querySelector('[data-sq="' + focused + '"]'); if (f) f.focus(); }

      GNC.clear(controls);
      if (m.status === 'active' && me >= 0) {
        controls.appendChild(el('button', { class: 'gn-btn gn-quiet', disabled: sending || !!v.drawOffer, onclick: function () {
          api.confirm('Offer a draw?', 'The game ends in a draw only if ' + person(v.players[1 - me]).name + ' accepts.', 'Offer draw').then(function (y) { if (y) act({ type: 'offer-draw' }); });

          pending = pending.filter(function (x) { return x !== fromCell; });

    function cellAt(x, y) {

    }
    function rackAt(x, y) {
      var hit = document.elementFromPoint(x, y);

    // ---- keyboard on the board
    function onBoardKey(e) {

      var r = +t.dataset.r, c = +t.dataset.c;
      var go = function (nr, nc) {
        nr = Math.max(0, Math.min(14, nr)); nc = Math.max(0, Math.min(14, nc));
        cursor.r = nr; cursor.c = nc;

        if (n) n.focus();

      if (e.key === 'ArrowRight') { e.preventDefault(); cursor.across = true; go(r, c + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); cursor.across = true; go(r, c - 1); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); cursor.across = false; go(r + 1, c); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); cursor.across = false; go(r - 1, c); }

        var asBlank = false;

        if (slot < 0) { api.toast('No ' + L + ' on your rack.', 'info'); api.sound('bad'); return; }

    function renderScores() {

        onclick: function (e) { root.classList.toggle('ww-zoom'); e.currentTarget.setAttribute('aria-pressed', root.classList.contains('ww-zoom') ? 'true' : 'false'); } }, 'Zoom'));
    }

    function describe(mv) {

    function render(animate) {

      renderControls();

GNC.games["wordwright"].howTo = "<p><strong>Wordwright</strong> is a crossword game for 2 to 4 players. Build words on the board from your rack of seven letter tiles; every word you make or extend scores.</p>\n<h3>Your turn</h3>\n<ul>\n<li><strong>Play:</strong> put one or more tiles in a single row or column, with no gaps, so they join tiles already on the board. The very first word must cover the ★ in the middle and use at least two tiles.</li>\n<li><strong>Swap tiles:</strong> return some tiles to the bag and draw the same number (only while the bag holds at least 7). You score nothing.</li>\n<li><strong>Pass:</strong> do nothing this turn.</li>\n<li><strong>Resign:</strong> leave this match at any time. Your unplayed tiles are deducted from your score, then returned to the bag. Your score is frozen and your turns are skipped. If only one player remains, that player wins immediately.</li>\n</ul>\n<p>To place a tile, tap it on your rack and then tap a square, or drag it there. Drag tiles between rack slots to sort them, or tap Arrange tiles and then tap a tile and its new position. Sorting stays in this browser and does not use a turn. Take back placed tiles before sorting. With a keyboard, move to a square with the arrow keys and type letters. Tap a tile you placed (or press Backspace) to take it back. The line under your rack shows what the move would score before you commit it. Your unplayed tiles stay put while other people move, unless the board changes under them.</p>\n<h3>Scoring</h3>\n<ul>\n<li>Each tile shows its points. A <strong>blank</strong> (dashed outline) can be any letter you choose and is worth 0.</li>\n<li>Coloured squares count only when you place a new tile on them: <strong>2× letter</strong> and <strong>3× letter</strong> multiply that tile; <strong>2× word</strong> and <strong>3× word</strong> (and the ★, which is 2× word) multiply the whole word. Two word squares in one word multiply together.</li>\n<li>Every new word your tiles form counts, including words made across.</li>\n<li>Use all seven tiles in one turn for <strong>50 extra points</strong>.</li>\n</ul>\n<h3>The end</h3>\n<ul>\n<li>The game ends when someone uses their last tile after the bag is empty, or after six scoreless turns in a row (passes, swaps, or plays worth 0).</li>\n<li>Everyone loses the points on the tiles left on their rack. If someone went out, they gain all of those points. These adjustments are listed at the end of the game.</li>\n<li>Among players who have not resigned, highest score wins; equal top scores tie.</li>\n<li>When the board is stuck, players can Pass until six scoreless turns end the game with normal scoring. Abandon match ends it early without a winner.</li>\n</ul>\n<h3>Table options</h3>\n<ul>\n<li><strong>Check words against the word list</strong> (on by default) uses the public-domain ENABLE list, plus a few common two-letter words, downloaded once by the group's installation. Turn it off to let players decide among themselves.</li>\n<li><strong>Board</strong> changes only the picture. The drawn board follows the table's look; the artwork boards are optional pictures that an installation may leave out.</li>\n</ul>\n";</script>

    patch(T.setup, function () {

    patch(T.history, function () {

  function closeTable() {

    });
  }

    } }, 'Join video call') : null;

    if (isHost()) {

        (t.meet_url ? 'Video call: ' + t.meet_url + '\n' : '');
    };
    var copyLink = el('button', { class: 'gn-btn gn-quiet', onclick: function () {
      GNC.copyText(t.link).then(function (ok) { GNC.toast(ok ? 'Link copied.' : 'Copy failed; select the link and copy it.', ok ? 'good' : 'bad'); });
    } }, 'Copy link');
    var copyMsg = el('button', { class: 'gn-btn gn-quiet', onclick: function () {

    } }, 'Copy invitation');
    var parts = [
      el('p', { class: 'gn-help' }, 'The link opens this table. It never signs anyone in: people still need the group code and their own name.'),

      el('div', { class: 'gn-row gn-wrap' }, copyLink, copyMsg),

    if (isHost()) {

      var emails = el('input', { id: 'inv-emails', type: 'text', placeholder: 'name@example.com, …', 'data-focus': 'inv-emails' });
      var codeMail = el('input', { type: 'checkbox' });
      var send = el('button', { class: 'gn-btn', onclick: function (e) {

          emails: emails.value.split(/[\s,;]+/).filter(function (x) { return x; }), includeCode: codeMail.checked };
        if (!spec.members.length && !spec.emails.length) return GNC.toast('Pick someone or type an email address.', 'bad');
        tableAct('invite', [spec], e.currentTarget).then(function (r) {

        el('label', { for: 'inv-emails' }, 'Other email addresses'), emails,
        el('label', { class: 'gn-check' }, codeMail, ' Include the group code in the email'),

  // ------------------------------------------------------------------ status and match

  function renderStatus() {
    var t = app.table, m = app.match;
    patch(T.status, function () {
      if (!m) return t.status === 'open' ? el('div', { class: 'gn-banner' }, t.startBlock || 'Ready to start.') : null;
      if (m.status === 'active') {
        var mine = m.actors.indexOf(app.lobby.me.id) >= 0;
        var names = m.players.filter(function (p) { return m.actors.indexOf(p.id) >= 0; }).map(function (p) { return p.name; });
        var botActor = m.players.some(function (p) { return p.bot && m.actors.indexOf(p.id) >= 0; });
        var line = botActor ? 'Computer thinking…' : m.spectator ? 'Watching. ' + (names.length ? 'Waiting for ' + names.join(' and ') + '.' : '')
          : mine ? (m.actors.length > 1 ? 'Your move (others can move too).' : 'Your turn.') : 'Waiting for ' + names.join(' and ') + '.';
        var end = m.spectator ? null : el('button', { class: 'gn-link', onclick: abandonMatch }, 'Abandon match');
        return el('div', { class: 'gn-banner' + (mine ? ' gn-banner-go' : '') }, el('span', { role: 'status' }, line), end);
      }
      var r = m.result || {};
      var winners = m.players.filter(function (p) { return (r.winners || []).indexOf(p.id) >= 0; }).map(function (p) { return p.name; });
      var head = m.status === 'abandoned' ? 'Game ended early.' : winners.length > 1 ? 'Tie: ' + winners.join(' and ') + '.'
        : winners.length ? winners[0] + ' wins!' : 'Draw.';
      return el('div', { class: 'gn-banner gn-banner-done' }, el('strong', { role: 'status' }, head),
        r.scores ? el('span', null, m.players.map(function (p) { return p.name + ' ' + (r.scores[p.id] !== undefined ? r.scores[p.id] : ''); }).join(' · ')) : null,
        el('button', { class: 'gn-btn gn-quiet', onclick: function () { GNC.replay.open(m.id); } }, 'Watch replay'),
        t.status === 'open' ? el('span', { class: 'gn-help' }, isHost() ? 'Play again: everyone taps "I\'m ready", then Start. Or change the game.' : 'Tap "I\'m ready" to play again.') : null);
    });
  }

  function abandonMatch() {
    var wordwright = app.match && app.match.game_id === 'wordwright';
    var detail = 'This stops the match without scoring a winner. The table stays open for another game.' +
      (wordwright ? ' To finish Wordwright normally, players can Pass until six scoreless turns; rack points are then deducted and a winner is declared.' : '');
    GNC.confirm('Abandon this match for everyone?', detail, 'Abandon match', 'Keep playing').then(function (yes) {
      if (!yes) return;
      var m = app.match;
      GNC.call('abandon', GNC.session.token(), m.id, GNC.req(m.rev)).then(function (res) {
        if (res.match) setMatch(res.match, 'mine');
        if (!res.ok) showError(res);
        GNC.poller.now();
      });
    });
  }

  function loadMatch(id) {
    GNC.call('match', GNC.session.token(), id).then(function (res) {
      if (res.ok && app.table && app.table.current_match_id === id) setMatch(res.match, 'initial');
    });
  }

  function destroyFrame() {
    if (app.frame) { try { app.frame.destroy(); } catch (e) { /* ignore */ } }
    app.frame = null;
  }

  /** Mount the game module once per match; later states go to update(), keeping drafts. */
  function setMatch(m, reason) {
    if (app.screen !== 'table' || !app.table || app.table.current_match_id !== m.id) return;
    var prev = app.match;
    if (prev && prev.id === m.id && m.rev < prev.rev) return;       // never go backwards
    app.match = m;
    if (!app.frame || app.frame.matchId !== m.id) {
      destroyFrame();
      clear(T.play);
      var mod = GNC.games[m.game_id];
      if (!mod) { T.play.appendChild(el('p', { class: 'gn-banner' }, 'This page has no board for ' + m.game_id + '. Reload to update.')); return renderStatus(); }
      var host = el('div', { class: 'gn-board-host', 'data-game': m.game_id });
      T.play.appendChild(host);
      var inst = mod.mount(host, frameApi(m));
      app.frame = { matchId: m.id, inst: inst, destroy: function () { if (inst && inst.destroy) inst.destroy(); } };
      inst.update(m, { reason: 'initial', previous: null });
    } else if (!prev || prev.rev !== m.rev || reason === 'stale') {
      app.frame.inst.update(m, { reason: reason, previous: prev });
      if (m.status === 'active' && prev && prev.actors.indexOf(app.lobby.me.id) < 0 && m.actors.indexOf(app.lobby.me.id) >= 0) {
        GNC.sound.play('turn');
        GNC.announce('Your turn.');
      }
      if (prev && prev.status === 'active' && m.status !== 'active') {
        var won = (m.result && m.result.winners || []).indexOf(app.lobby.me.id) >= 0;
        GNC.sound.play(won ? 'win' : 'score');
      }
    }
    renderStatus();
    requestBotTurn(m);
  }

  function requestBotTurn(m) {
    if (m.status !== 'active' || !m.players.some(function (p) { return p.bot && m.actors.indexOf(p.id) >= 0; })) return;
    var key = m.id + ':' + m.rev;
    if (app.botPending === key) return;
    app.botPending = key;
    GNC.call('botTurn', GNC.session.token(), m.id, m.rev).then(function (res) {
      if (app.botPending === key) app.botPending = '';
      if (app.screen !== 'table' || !app.match || app.match.id !== m.id) return;
      if (res.match) setMatch(res.match, res.ok ? 'bot' : 'stale');
      if (!res.ok && res.code !== 'STALE') {
        showError(res);
        if (res.code === 'DICT') setTimeout(function () { if (app.match && app.match.id === m.id) requestBotTurn(app.match); }, 5000);
      }
      GNC.poller.now();
    }).catch(function () {
      if (app.botPending === key) app.botPending = '';
      if (app.match && app.match.id === m.id) setTimeout(function () { requestBotTurn(app.match); }, 5000);
    });
  }

  function frameApi(m) {
    var players = m.players.map(function (p, i) {
      var st = GNC.seatStyle(m.theme_id, i);
      return { id: p.id, name: p.name, seat: i, color: st.color, text: st.text, symbol: st.symbol };
    });
    return {
      me: app.lobby.me.id,
      players: players,
      player: function (id) { return players.filter(function (p) { return p.id === id; })[0] || null; },
      theme: GNC.themes[m.theme_id],
      sound: function (n) { GNC.sound.play(n); },
      announce: GNC.announce,
      toast: GNC.toast,
      confirm: GNC.confirm,
      el: GNC.el,
      /** Send an action. Resolves {ok, match, response, error, code}; the frame is updated first. */
      act: function (action) {
        var cur = app.match;
        return GNC.call('act', GNC.session.token(), cur.id, action, GNC.req(cur.rev)).then(function (res) {
          if (res.match) setMatch(res.match, res.ok ? 'mine' : 'stale');
          if (!res.ok) {
            if (res.code === 'STALE') GNC.toast(res.error, 'info');
            else { GNC.toast(res.error || 'That move is not allowed.', 'bad'); GNC.sound.play('bad'); }
          }
          GNC.poller.now();
          return res;
        });
      },
      query: function (q) { return GNC.call('query', GNC.session.token(), app.match.id, q); },
    };
  }

  // ------------------------------------------------------------------ polling glue

  GNC.poller.want = function () {
    if (app.screen === 'lobby') return { lobby: app.lobbyV, members: app.lobby.members.map(function (m) { return m.id; }) };
    if (app.screen === 'table' && app.table) {
      var w = { table: { id: app.table.id, rev: app.table.rev, seats: app.table.seats.map(function (s) { return s.member_id; }) } };
      if (app.match) w.match = { id: app.match.id, rev: app.match.rev, players: app.match.players.map(function (p) { return p.id; }) };
      return w;
    }
    return {};
  };

  GNC.poller.pace = function () {
    if (app.screen === 'table' && app.table) {
      var m = app.match;
      if (m && m.status === 'active') return m.actors.indexOf(app.lobby.me.id) >= 0 && m.actors.length === 1 ? 8000 : 2500;
      return 3000;
    }
    return 10000;
  };

  GNC.poller.onResult = function (res, want) {
    if (want && want.table && (!app.table || want.table.id !== app.table.id)) return;
    if (res.lobby && res.lobby.changed && app.screen === 'lobby') {
      app.lobby = res.lobby.lobby; app.lobbyV = res.lobby.v;
      renderLobbyParts();
    } else if (res.lobby) {
      app.lobbyV = res.lobby.v;
      if (res.lobby.here && app.screen === 'lobby' && res.lobby.here.join() !== app.lobby.here.join()) {
        app.lobby.here = res.lobby.here;
        renderLobbyParts();
      }
    }
    if (app.screen !== 'table' || !app.table) return;
    if (res.table) {
      if (res.table.changed && res.table.table) setTable(res.table.table);
      else if (res.table.here) {
        var changed = res.table.here.join() !== app.here.join();
        app.here = res.table.here;
        if (changed) renderTable();
      }
    }
    if (res.match && app.match) {
      if (res.match.changed && res.match.match) setMatch(res.match.match, 'poll');
      if (res.match.here) app.matchHere = res.match.here;
    }
  };

  // ------------------------------------------------------------------ start

  if (!GNC.boot.ready) {
    root.appendChild(el('main', { class: 'gn-center' }, el('div', { class: 'gn-card' },
      el('h1', null, GNC.boot.platform || 'Game Night'),
      el('p', null, 'This group is not set up yet.'),
      el('p', { class: 'gn-help' }, 'The owner opens the spreadsheet that holds this game and chooses Game Night › Set up this spreadsheet.'))));
    return;
  }
  GNC.applyTheme(Object.keys(GNC.themes)[0]);
  if (GNC.session.token()) enterLobby(); else showEntry(app.pendingLink ? 'Sign in to open the table you were invited to.' : '');
})();
</script>
</body>
</html>
